[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echosync-mcp"
version = "0.1.0"
description = "MCP server exposing EchoSync AI practice sessions"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0"]

[tool.setuptools]
packages = ["echosync_mcp"]
