# ─────────────────────────────────────────────────────────────
# EchoSync AI — two profiles, one file.
#
#   docker compose -f docker/docker-compose.yml --profile gpu   up --build
#   docker compose -f docker/docker-compose.yml --profile cloud up --build
#
# `gpu`   → local pipeline on your RTX 5070 + an Ollama container.
# `cloud` → CPU-only image routing STT/LLM to Groq. This is the profile a
#           reviewer runs, and the one a Hugging Face Space would use.
# ─────────────────────────────────────────────────────────────
name: echosync

services:
  # ── local GPU backend ──────────────────────────────────────
  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    ports: ["8000:8000"]
    env_file: [../.env]
    environment:
      ENGINE_MODE: ${ENGINE_MODE:-auto}
      # Reach the Ollama service by name on the compose network.
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ../data:/app/data
      - model-cache:/app/models
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ── cloud / demo backend ───────────────────────────────────
  backend-cloud:
    profiles: ["cloud"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cloud
    ports: ["8000:8000"]
    env_file: [../.env]
    environment:
      ENGINE_MODE: cloud
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  # ── Ollama (gpu profile only) ──────────────────────────────
  # Kept as its own service so the model cache survives image rebuilds —
  # re-pulling a 2 GB model on every `--build` gets old fast.
  ollama:
    profiles: ["gpu"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ── frontend (both profiles) ───────────────────────────────
  frontend:
    profiles: ["gpu", "cloud"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports: ["3000:3000"]
    environment:
      # The browser resolves these, so they must be host-visible addresses,
      # not compose service names.
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/voice
    restart: unless-stopped

volumes:
  ollama-models:
  model-cache:
